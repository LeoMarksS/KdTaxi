openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /request-ride:
    post:
      operationId: requestRide
      tags: [rides]
      summary: Request a ride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestRide"
      responses:
        "200":
          description: Ride requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    VehicleType:
      type: string
      enum:
        - car
        - motorcycle
    Ride:
      type: object
      properties:
        id:
          type: string
        clientId:
          type: string
        clientName:
          type: string
        clientPhone:
          type: string
        clientPhoto:
          type: string
        origin:
          type: string
        destination:
          type: string
        vehicleType:
          $ref: "#/components/schemas/VehicleType"
        price:
          type: number
        payment:
          type: string
          enum: [pix, dinheiro]
        status:
          type: string
          enum: [waiting, accepted, in_progress, finished, cancelled]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - clientId
        - clientName
        - clientPhone
        - origin
        - destination
        - vehicleType
        - status
        - createdAt
    RequestRide:
      type: object
      properties:
        clientId:
          type: string
        clientName:
          type: string
        clientPhone:
          type: string
        clientPhoto:
          type: string
        origin:
          type: string
        destination:
          type: string
        vehicleType:
          $ref: "#/components/schemas/VehicleType"
        payment:
          type: string
          enum: [pix, dinheiro]
      required:
        - clientId
        - clientName
        - clientPhone
        - origin
        - destination
        - vehicleType

